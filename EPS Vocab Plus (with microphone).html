<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPS Vocab Plus</title>
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#17261d;--mute:#5d6e63;--line:#d8e2d9;--acc:#1f7a4d;--acc2:#e6f3ea;--bad:#b3402f;--bad2:#fbeae6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#182419;--ink:#e8f1ea;--mute:#9bb0a1;--line:#2a3a2f;--acc:#4cc18a;--acc2:#1d3326;--bad:#ef8a78;--bad2:#3a2420}}
:root[data-theme="dark"]{--bg:#101a14;--card:#182419;--ink:#e8f1ea;--mute:#9bb0a1;--line:#2a3a2f;--acc:#4cc18a;--acc2:#1d3326;--bad:#ef8a78;--bad2:#3a2420}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0;flex:1}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{padding:6px 12px;min-height:38px;border-radius:99px;font-size:14px}
.chips .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>*{flex:1;min-width:0}
select,input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:44px;margin-bottom:8px}
.row select{margin:0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 16px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.big{font-size:44px;font-weight:700;line-height:1.2;word-break:keep-all}.mid{font-size:26px;font-weight:600}
.hint{color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts>*{flex:1;white-space:nowrap}
.opts{display:grid;gap:8px;width:100%;margin-top:8px}.opts button{text-align:left}
.opts .ok{background:var(--acc2);border-color:var(--acc)}.opts .no{background:var(--bad2);border-color:var(--bad)}
.mic{width:88px;height:88px;border-radius:50%;font-size:36px;padding:0;background:var(--acc);color:#fff;border-color:var(--acc)}
.mic.live{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.good{color:var(--acc);font-weight:600}.bad{color:var(--bad);font-weight:600}
.item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}.item span{flex:1;cursor:pointer}
.item button{min-height:36px;padding:2px 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px}summary{cursor:pointer;font-weight:600}
.star.on{color:#d49a00}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<header><h1>EPS Vocab Plus</h1><button id="addb" class="pri">+ Add word</button><button id="theme" aria-label="Toggle dark mode">🌙</button></header>
<div class="row"><select id="cat" aria-label="Category"></select><select id="dir" aria-label="Direction"><option value="ke">Korean → English</option><option value="ek">English → Korean</option></select></div>
<div class="chips" id="modes"><button data-m="card" class="on">Flashcards</button><button data-m="quiz">Quiz</button><button data-m="type">Typing</button><button data-m="speak">🎤 Speak</button></div>
<div class="chips" id="opts"><button data-o="star">★ Starred</button><button data-o="miss">Missed only</button><button data-o="sound">Auto-sound</button><button data-o="rom">Romanization</button></div>
<div class="bar"><i id="pb"></i></div>
<div class="meta"><span id="pos"></span><span id="stat"></span></div>
<div class="card" id="card"></div>
<div class="acts" id="acts"></div>
<div class="acts"><button id="shuf">Shuffle all</button><button id="reset">Reset progress</button></div>
<details><summary>Word list (<span id="cnt"></span>)</summary><input type="text" id="q" placeholder="Search…" style="margin-top:10px"><div id="list"></div>
<div class="acts"><button id="exp">Copy list</button><button id="imp">Paste list</button><button id="rst">Default words</button></div><p class="hint" id="msg" role="status"></p></details>
<p class="hint">Mic needs Chrome, Edge or Safari and permission to use the microphone. Sound uses your device’s Korean voice.</p>
</main>
<dialog id="dlg"><h2 id="dt" style="margin-top:0;font-size:18px">Add a word</h2>
<input type="text" id="aKo" placeholder="Korean (예: 공장)"><input type="text" id="aRo" placeholder="Romanization (optional)"><input type="text" id="aEn" placeholder="Meaning in English"><input type="text" id="aCat" placeholder="Category">
<div class="acts"><button id="dcancel">Cancel</button><button id="dsave" class="pri">Save</button></div></dialog>
<script>
const DEF=[
["공장","gongjang","factory","Work"],["사장님","sajangnim","boss","Work"],["월급","wolgeup","salary","Work"],["휴가","hyuga","vacation","Work"],["일","il","work","Work"],["기계","gigye","machine","Work"],["작업","jageop","task","Work"],["회사","hoesa","company","Work"],["동료","dongnyo","coworker","Work"],["출근","chulgeun","go to work","Work"],["퇴근","toegeun","leave work","Work"],["계약","gyeyak","contract","Work"],
["위험","wiheom","danger","Safety"],["조심","josim","caution","Safety"],["안전모","anjeonmo","safety helmet","Safety"],["장갑","janggap","gloves","Safety"],["불","bul","fire","Safety"],["사고","sago","accident","Safety"],["비상구","bisanggu","emergency exit","Safety"],["마스크","maseukeu","mask","Safety"],["다치다","dachida","get hurt","Safety"],
["집","jip","house","Daily life"],["버스","beoseu","bus","Daily life"],["은행","eunhaeng","bank","Daily life"],["병원","byeongwon","hospital","Daily life"],["시장","sijang","market","Daily life"],["전화","jeonhwa","phone call","Daily life"],["돈","don","money","Daily life"],["물","mul","water","Daily life"],["학교","hakgyo","school","Daily life"],["친구","chingu","friend","Daily life"],
["밥","bap","rice","Food"],["김치","gimchi","kimchi","Food"],["고기","gogi","meat","Food"],["점심","jeomsim","lunch","Food"],["맛있다","masitda","delicious","Food"],["배고프다","baegopeuda","hungry","Food"],["국","guk","soup","Food"],["계란","gyeran","egg","Food"],
["머리","meori","head","Body & health"],["손","son","hand","Body & health"],["발","bal","foot","Body & health"],["아프다","apeuda","sick","Body & health"],["약","yak","medicine","Body & health"],["의사","uisa","doctor","Body & health"],["감기","gamgi","cold","Body & health"],["허리","heori","lower back","Body & health"],
["오늘","oneul","today","Time"],["내일","naeil","tomorrow","Time"],["어제","eoje","yesterday","Time"],["아침","achim","morning","Time"],["저녁","jeonyeok","evening","Time"],["주말","jumal","weekend","Time"]
].map(a=>({ko:a[0],ro:a[1],en:a[2],cat:a[3]}));
const $=s=>document.querySelector(s);
let S={words:DEF.slice(),prog:{},opt:{sound:false,rom:true,star:false,miss:false},dark:null};
try{const r=localStorage.getItem("epsv3");if(r){const o=JSON.parse(r);if(o&&o.words&&o.words.length)S=Object.assign(S,o)}}catch(e){}
const save=()=>{try{localStorage.setItem("epsv3",JSON.stringify(S))}catch(e){}};
let mode="card",deck=[],i=0,flip=false,ans=false,score=0,heard="",rec=null,editIdx=-1;
const P=w=>S.prog[w.ko]||(S.prog[w.ko]={k:0,m:0,s:0});
const Q=()=>$("#dir").value==="ke";
const ask=w=>Q()?w.ko:w.en,key=w=>Q()?w.en:w.ko;
const norm=s=>s.toLowerCase().replace(/[\s.,!?'"]/g,"");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function cats(){const c=[...new Set(S.words.map(w=>w.cat))],v=$("#cat").value;$("#cat").innerHTML='<option value="">All categories</option>'+c.map(x=>`<option>${x}</option>`).join("");$("#cat").value=c.includes(v)?v:""}
function build(keep){const c=$("#cat").value;deck=S.words.filter(w=>(!c||w.cat===c)&&(!S.opt.star||P(w).s)&&(!S.opt.miss||P(w).m>P(w).k));if(!keep)shuffle(deck);i=0;flip=false;ans=false;heard="";render()}
const btn=(t,id,c)=>`<button id="${id}" class="${c||""}">${t}</button>`;
function check(w,said){ // returns true if the spoken/typed text matches the answer
 const a=norm(said);if(!a)return false;
 if(Q()||mode==="type"&&Q())return key(w).toLowerCase().split(/\s*\/\s*/).some(x=>{x=norm(x);return a===x||a===x.replace(/^to/,"")||a.includes(x)});
 return a===norm(w.ko)||a.includes(norm(w.ko));
}
function render(){
 document.querySelectorAll("#opts button").forEach(b=>b.classList.toggle("on",!!S.opt[b.dataset.o]));
 document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
 const known=S.words.filter(w=>P(w).k>P(w).m).length;
 $("#stat").textContent=`Known ${known}/${S.words.length}`+(mode!=="card"?` · Score ${score}`:"");
 $("#pb").style.width=(S.words.length?known/S.words.length*100:0)+"%";
 $("#cnt").textContent=S.words.length;
 const c=$("#card"),a=$("#acts");
 if(!deck.length){$("#pos").textContent="0 / 0";c.innerHTML='<div class="mid">No words here</div><div class="hint">Change the category or turn off a filter.</div>';a.innerHTML="";return}
 if(i>=deck.length){c.innerHTML=`<div class="mid">Round complete</div>${mode==="card"?"":`<div>Score: ${score} / ${deck.length}</div>`}`;a.innerHTML=btn("Start again","again","pri");$("#pos").textContent=deck.length+" / "+deck.length;return}
 const w=deck[i],r=S.opt.rom&&w.ro?`<div class="hint">${w.ro}</div>`:"";
 $("#pos").textContent=`${i+1} / ${deck.length}`;
 const tools=btn("🔊","say")+`<button class="star ${P(w).s?"on":""}" id="star" aria-label="Star word">${P(w).s?"★":"☆"}</button>`+btn("Edit","edit");
 if(mode==="card"){
  c.innerHTML=`<div class="big">${ask(w)}</div>${Q()?r:""}${flip?`<div class="mid good">${key(w)}</div>${Q()?"":r}`:'<div class="hint">Tap “Show answer”</div>'}`;
  a.innerHTML=tools+btn(flip?"Hide":"Show answer","flip","pri")+btn("Next","nxt")+(flip?btn("Need practice","no")+btn("I know it","yes","pri"):"");
 }else if(mode==="quiz"){
  const o=shuffle([w,...shuffle(S.words.filter(x=>x.ko!==w.ko)).slice(0,3)]);
  c.innerHTML=`<div class="big">${ask(w)}</div>${Q()?r:""}<div class="opts">${o.map(x=>`<button data-a="${x.ko}">${key(x)}</button>`).join("")}</div>`;
  a.innerHTML=tools+btn("Next","nxt","pri");
 }else if(mode==="type"){
  c.innerHTML=`<div class="big">${ask(w)}</div>${Q()?r:""}<div class="row" style="width:100%;margin:8px 0 0"><input type="text" id="ti" placeholder="${Q()?"Type the English meaning":"한글로 입력"}" autocomplete="off" autocapitalize="off" style="margin:0"><button id="mic" style="flex:0 0 52px" aria-label="Speak answer">🎤</button></div><div id="fb" role="status"></div>`;
  a.innerHTML=tools+btn("Check","chk","pri")+btn("Next","nxt");
 }else{
  c.innerHTML=`<div class="big">${ask(w)}</div>${Q()?r:""}<div class="hint">${Q()?"Say the English meaning":"한국어로 말하세요 (say it in Korean)"}</div><button id="mic" class="mic" aria-label="Start microphone">🎤</button><div id="fb" role="status">${heard?`Heard: “${heard}”`:SR?"Tap the mic and speak":'<span class="bad">Speech recognition is not supported in this browser.</span>'}</div>`;
  a.innerHTML=tools+btn("Show answer","show")+btn("Next","nxt","pri");
 }
 if(S.opt.sound&&!ans&&mode!=="speak"&&(mode!=="quiz"||Q()))speak(w.ko);
}
function mark(w,ok){const p=P(w);ok?p.k++:p.m++;save()}
function next(){i++;flip=false;ans=false;heard="";render()}
function finish(w,ok,said){ans=true;if(ok)score++;mark(w,ok);const f=$("#fb");
 f.innerHTML=(said?`Heard: “${said}”<br>`:"")+(ok?'<span class="good">Correct! 👍</span>':`<span class="bad">Answer: ${key(w)}</span>`);
 if(!Q()||ok)speak(w.ko);$("#stat").textContent=$("#stat").textContent.replace(/Score \d+/,"Score "+score)}
function listen(){
 const w=deck[i];if(!SR){$("#fb").innerHTML='<span class="bad">Speech recognition is not supported here. Try Chrome or Safari.</span>';return}
 if(rec){try{rec.stop()}catch(e){}return}
 rec=new SR();rec.lang=Q()?"en-US":"ko-KR";rec.maxAlternatives=5;rec.interimResults=false;
 const m=$("#mic");m.classList.add("live");$("#fb").textContent="Listening…";
 rec.onresult=ev=>{const alts=[...ev.results[0]].map(x=>x.transcript);const ok=alts.some(t=>check(w,t));const said=ok?alts.find(t=>check(w,t)):alts[0];
  if(mode==="type"){$("#ti").value=said;$("#fb").textContent="Tap Check";}else{heard=said;if(!ans)finish(w,ok,said)}};
 rec.onerror=ev=>{$("#fb").innerHTML='<span class="bad">'+(ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Microphone is blocked. Allow it in your browser settings.":ev.error==="no-speech"?"I didn’t hear anything. Try again.":"Mic error: "+ev.error)+"</span>"};
 rec.onend=()=>{rec=null;const b=$("#mic");b&&b.classList.remove("live")};
 try{rec.start()}catch(e){rec=null}
}
function openDlg(n){editIdx=n;const w=n>=0?S.words[n]:{ko:"",ro:"",en:"",cat:""};$("#dt").textContent=n>=0?"Edit word":"Add a word";$("#aKo").value=w.ko;$("#aRo").value=w.ro;$("#aEn").value=w.en;$("#aCat").value=w.cat;$("#dlg").showModal()}
function list(){const q=$("#q").value.toLowerCase();
 $("#list").innerHTML=S.words.map((w,n)=>({w,n})).filter(x=>(x.w.ko+x.w.en+x.w.ro+x.w.cat).toLowerCase().includes(q)).slice(0,80).map(x=>`<div class="item"><span data-go="${x.n}"><b>${x.w.ko}</b> ${x.w.en}</span><button class="star ${P(x.w).s?"on":""}" data-st="${x.n}" aria-label="Star">${P(x.w).s?"★":"☆"}</button><button data-ed="${x.n}">Edit</button><button data-del="${x.n}" aria-label="Delete ${x.w.ko}">✕</button></div>`).join("")}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){deck=[S.words[+g.dataset.go]];i=0;flip=false;ans=false;heard="";render();window.scrollTo({top:0,behavior:"smooth"});return}
 const t=e.target.closest("button");if(!t)return;const id=t.id,w=deck[i];
 if(t.dataset.m){mode=t.dataset.m;score=0;build(true);return}
 if(t.dataset.o){S.opt[t.dataset.o]=!S.opt[t.dataset.o];save();build(true);return}
 if(t.dataset.a&&w&&!ans){ans=true;const ok=t.dataset.a===w.ko;if(ok)score++;mark(w,ok);document.querySelectorAll(".opts button").forEach(b=>{if(b.dataset.a===w.ko)b.classList.add("ok");else if(b===t)b.classList.add("no")});speak(w.ko);$("#stat").textContent=$("#stat").textContent.replace(/Score \d+/,"Score "+score);return}
 if(t.dataset.st){const x=S.words[+t.dataset.st];P(x).s=P(x).s?0:1;save();list();render();return}
 if(t.dataset.ed){openDlg(+t.dataset.ed);return}
 if(t.dataset.del){if(confirm("Delete this word?")){S.words.splice(+t.dataset.del,1);save();cats();list();build()}return}
 if(id==="again"){score=0;build()}
 else if(id==="addb")openDlg(-1);
 else if(id==="edit"&&w)openDlg(S.words.indexOf(w));
 else if(id==="dcancel")$("#dlg").close();
 else if(id==="dsave"){const ko=$("#aKo").value.trim(),en=$("#aEn").value.trim();if(!ko||!en){$("#aKo").focus();return}
  const o={ko,ro:$("#aRo").value.trim(),en,cat:$("#aCat").value.trim()||"My words"};if(editIdx>=0)S.words[editIdx]=o;else S.words.push(o);save();$("#dlg").close();cats();list();build(true)}
 else if(id==="theme"){const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#101a14";d.dataset.theme=dark?"light":"dark";S.dark=d.dataset.theme;save()}
 else if(id==="say"&&w)speak(w.ko);
 else if(id==="star"&&w){P(w).s=P(w).s?0:1;save();list();render()}
 else if(id==="flip"){flip=!flip;render();if(flip&&w)speak(w.ko)}
 else if(id==="nxt"){if(rec){try{rec.abort()}catch(x){}}next()}
 else if(id==="yes"){mark(w,true);next()}
 else if(id==="no"){mark(w,false);next()}
 else if(id==="mic"&&w&&!ans)listen();
 else if(id==="show"&&w&&!ans){finish(w,false,"")}
 else if(id==="chk"&&!ans){const v=$("#ti").value;if(!v.trim())return;finish(w,check(w,v),"")}
 else if(id==="shuf"){build()}
 else if(id==="reset"){if(confirm("Reset all progress and stars?")){S.prog={};score=0;save();list();build()}}
 else if(id==="exp"){const txt=S.words.map(x=>[x.ko,x.ro,x.en,x.cat].join("\t")).join("\n");try{navigator.clipboard.writeText(txt).then(()=>$("#msg").textContent="Copied.")}catch(x){$("#msg").textContent="Copy not available."}}
 else if(id==="imp"){const txt=prompt("Paste lines: Korean[TAB]romanization[TAB]English[TAB]category");if(txt){const n=txt.split("\n").map(l=>l.split("\t")).filter(p=>p[0]&&p[2]).map(p=>({ko:p[0].trim(),ro:(p[1]||"").trim(),en:p[2].trim(),cat:(p[3]||"My words").trim()}));S.words.push(...n);save();cats();list();build();$("#msg").textContent="Added "+n.length+" words."}}
 else if(id==="rst"){if(confirm("Replace your list with the default words?")){S.words=DEF.slice();S.prog={};save();cats();list();build()}}
});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"){if(e.key==="Enter"&&$("#chk")&&e.target.id==="ti"){ans?next():$("#chk").click()}return}
 if($("#dlg").open)return;if(e.key==="ArrowRight")next();if(e.key===" "&&mode==="card"){e.preventDefault();flip=!flip;render()}});
$("#q").addEventListener("input",list);$("#cat").addEventListener("change",()=>build());$("#dir").addEventListener("change",()=>build(true));
if(S.dark)document.documentElement.dataset.theme=S.dark;
cats();list();build();
</script>
</body>
</html>
